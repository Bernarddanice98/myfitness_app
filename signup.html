<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>FitBlueprint · Create Account</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .signup-container {
      max-width: 450px;
      width: 100%;
      background: white;
      border-radius: 30px;
      padding: 40px 30px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      animation: fadeIn 0.5s ease;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .logo {
      text-align: center;
      margin-bottom: 30px;
    }
    
    .logo i {
      font-size: 60px;
      color: #667eea;
      margin-bottom: 10px;
    }
    
    .logo h1 {
      font-size: 28px;
      color: #667eea;
    }
    
    .logo p {
      color: #666;
      font-size: 14px;
      margin-top: 5px;
    }
    
    .input-group {
      margin-bottom: 20px;
    }
    
    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 500;
      font-size: 14px;
    }
    
    .input-icon {
      position: relative;
    }
    
    .input-icon i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #999;
    }
    
    input {
      width: 100%;
      padding: 14px 14px 14px 45px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      font-size: 16px;
      transition: 0.2s;
    }
    
    input:focus {
      outline: none;
      border-color: #667eea;
    }
    
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 10px;
    }
    
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }
    
    .login-link {
      text-align: center;
      margin-top: 25px;
      color: #666;
      font-size: 14px;
    }
    
    .login-link a {
      color: #667eea;
      text-decoration: none;
      font-weight: bold;
    }
    
    .error-message {
      background: #ffebee;
      color: #c62828;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 20px;
      text-align: center;
      font-size: 14px;
    }
    
    .success-message {
      background: #e8f5e9;
      color: #2e7d32;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 20px;
      text-align: center;
    }
    
    .requirements {
      font-size: 12px;
      color: #999;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div class="signup-container">
    <div class="logo">
      <i class="fas fa-fire"></i>
      <h1>Create Account</h1>
      <p>Start your fitness journey today</p>
    </div>
    
    <div id="messageArea"></div>
    
    <form id="signupForm">
      <div class="input-group">
        <label><i class="fas fa-user"></i> Username</label>
        <div class="input-icon">
          <i class="fas fa-user"></i>
          <input type="text" id="username" placeholder="Choose a username" required>
        </div>
      </div>
      
      <div class="input-group">
        <label><i class="fas fa-lock"></i> Password</label>
        <div class="input-icon">
          <i class="fas fa-lock"></i>
          <input type="password" id="password" placeholder="Create a password" required>
        </div>
        <div class="requirements">Password must be at least 6 characters</div>
      </div>
      
      <div class="input-group">
        <label><i class="fas fa-check-circle"></i> Confirm Password</label>
        <div class="input-icon">
          <i class="fas fa-check-circle"></i>
          <input type="password" id="confirmPassword" placeholder="Confirm your password" required>
        </div>
      </div>
      
      <button type="submit" id="signupBtn">
        <i class="fas fa-user-plus"></i> Create Account
      </button>
    </form>
    
    <div class="login-link">
      Already have an account? <a href="login.html">Sign In</a>
    </div>
  </div>

  <script>
    const API_URL = 'http://localhost:3000/api';
    
    function showMessage(message, type) {
      const messageArea = document.getElementById('messageArea');
      const className = type === 'error' ? 'error-message' : 'success-message';
      messageArea.innerHTML = `<div class="${className}">${message}</div>`;
      setTimeout(() => {
        messageArea.innerHTML = '';
      }, 4000);
    }
    
    async function createAccount(e) {
      e.preventDefault();
      
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const signupBtn = document.getElementById('signupBtn');
      
      if (!username || !password) {
        showMessage('Please fill in all fields', 'error');
        return;
      }
      
      if (password !== confirmPassword) {
        showMessage('Passwords do not match', 'error');
        return;
      }
      
      if (password.length < 6) {
        showMessage('Password must be at least 6 characters', 'error');
        return;
      }
      
      signupBtn.disabled = true;
      signupBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating account...';
      
      try {
        const response = await fetch(`${API_URL}/register`, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, password })
        });
        
        const data = await response.json();
        
        if (response.ok) {
          // Save auth data
          localStorage.setItem('authToken', data.token);
          localStorage.setItem('username', username);
          localStorage.setItem('userId', data.userId);
          
          // Initialize empty profile
          const emptyProfile = {
            height: 175,
            weight: 70,
            age: 25,
            gender: 'male',
            goal: 'maintain',
            frequency: 3,
            foodPrefs: '',
            exercisePrefs: ''
          };
          localStorage.setItem('fitBlueprintData', JSON.stringify(emptyProfile));
          localStorage.setItem('savedWorkouts', JSON.stringify([]));
          localStorage.setItem('workoutHistory', JSON.stringify({}));
          
          showMessage('Account created successfully! Redirecting...', 'success');
          
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 1500);
        } else {
          showMessage(data.error || 'Failed to create account', 'error');
        }
      } catch (error) {
        console.error('Signup error:', error);
        showMessage('Cannot connect to server. Make sure the backend is running on port 3000', 'error');
      } finally {
        signupBtn.disabled = false;
        signupBtn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
      }
    }
    
    document.getElementById('signupForm').addEventListener('submit', createAccount);
    
    // Check if already logged in
    if (localStorage.getItem('authToken')) {
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
