<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>FitBlueprint · Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .login-container {
      max-width: 420px;
      width: 100%;
      background: white;
      border-radius: 30px;
      padding: 40px 30px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    
    .logo {
      text-align: center;
      margin-bottom: 30px;
    }
    
    .logo i {
      font-size: 60px;
      color: #667eea;
    }
    
    .logo h1 {
      font-size: 28px;
      color: #667eea;
    }
    
    .input-group {
      margin-bottom: 20px;
    }
    
    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 500;
    }
    
    input {
      width: 100%;
      padding: 14px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      font-size: 16px;
    }
    
    input:focus {
      outline: none;
      border-color: #667eea;
    }
    
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    
    .error-message {
      background: #ffebee;
      color: #c62828;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 20px;
      text-align: center;
    }
    
    .success-message {
      background: #e8f5e9;
      color: #2e7d32;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 20px;
      text-align: center;
    }
    
    .switch-mode {
      text-align: center;
      margin-top: 20px;
      color: #666;
    }
    
    .switch-mode a {
      color: #667eea;
      text-decoration: none;
      cursor: pointer;
    }
    
    .demo-btn {
      background: transparent;
      border: 2px solid #667eea;
      color: #667eea;
      background: white;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">
      <i class="fas fa-fire"></i>
      <h1>FitBlueprint</h1>
    </div>
    
    <div id="messageArea"></div>
    
    <form id="authForm">
      <div class="input-group">
        <label>Username</label>
        <input type="text" id="username" placeholder="Enter username" required>
      </div>
      
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter password" required>
      </div>
      
      <button type="submit" id="submitBtn">Login</button>
    </form>
    
    <button class="demo-btn" id="demoBtn">Demo Account</button>
    
    <div class="switch-mode">
      Don't have an account? <a href="#" id="switchMode">Sign Up</a>
    </div>
  </div>

  <script>
    const API_URL = 'http://localhost:3000/api';
    let isLoginMode = true;
    
    function showMessage(message, type) {
      const messageArea = document.getElementById('messageArea');
      messageArea.innerHTML = `<div class="${type === 'error' ? 'error-message' : 'success-message'}">${message}</div>`;
      setTimeout(() => {
        messageArea.innerHTML = '';
      }, 3000);
    }
    
    async function handleAuth(e) {
      e.preventDefault();
      
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const submitBtn = document.getElementById('submitBtn');
      
      if (!username || !password) {
        showMessage('Please enter username and password', 'error');
        return;
      }
      
      const endpoint = isLoginMode ? '/login' : '/register';
      
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Please wait...';
      
      try {
        const response = await fetch(`${API_URL}${endpoint}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        
        const data = await response.json();
        
        if (response.ok) {
          // Set session expiry to 2 hours from now
          const sessionExpiresAt = Date.now() + (2 * 60 * 60 * 1000);
          
          localStorage.setItem('authToken', data.token);
          localStorage.setItem('username', username);
          localStorage.setItem('userId', data.userId);
          localStorage.setItem('sessionId', data.sessionId);
          localStorage.setItem('sessionExpiresAt', sessionExpiresAt);
          
          showMessage(isLoginMode ? 'Login successful! Redirecting...' : 'Account created! Logging in...', 'success');
          
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 1500);
        } else {
          showMessage(data.error || 'Authentication failed', 'error');
        }
      } catch (error) {
        console.error('Auth error:', error);
        showMessage('Network error. Please try again.', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = isLoginMode ? 'Login' : 'Sign Up';
      }
    }
    
    async function demoLogin() {
      const submitBtn = document.getElementById('demoBtn');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Loading demo...';
      
      try {
        const response = await fetch(`${API_URL}/demo-login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' }
        });
        
        const data = await response.json();
        
        if (response.ok) {
          const sessionExpiresAt = Date.now() + (2 * 60 * 60 * 1000);
          
          localStorage.setItem('authToken', data.token);
          localStorage.setItem('username', 'demo_user');
          localStorage.setItem('userId', data.userId);
          localStorage.setItem('sessionId', data.sessionId);
          localStorage.setItem('sessionExpiresAt', sessionExpiresAt);
          
          showMessage('Demo mode activated! Redirecting...', 'success');
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 1000);
        }
      } catch (error) {
        showMessage('Demo login failed', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Demo Account';
      }
    }
    
    document.getElementById('switchMode').addEventListener('click', (e) => {
      e.preventDefault();
      isLoginMode = !isLoginMode;
      const submitBtn = document.getElementById('submitBtn');
      if (isLoginMode) {
        submitBtn.textContent = 'Login';
        document.getElementById('switchMode').innerHTML = 'Don\'t have an account? <a href="#">Sign Up</a>';
      } else {
        submitBtn.textContent = 'Sign Up';
        document.getElementById('switchMode').innerHTML = 'Already have an account? <a href="#">Login</a>';
      }
    });
    
    document.getElementById('demoBtn').addEventListener('click', demoLogin);
    document.getElementById('authForm').addEventListener('submit', handleAuth);
    
    // Check if already logged in and session not expired
    const token = localStorage.getItem('authToken');
    const expiresAt = localStorage.getItem('sessionExpiresAt');
    if (token && expiresAt && Date.now() < parseInt(expiresAt)) {
      window.location.href = 'index.html';
    } else if (token) {
      // Session expired, clear localStorage
      localStorage.clear();
    }
  </script>
</body>
</html>
