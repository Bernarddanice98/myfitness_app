<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>FitBlueprint · Sign In</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .login-container {
      max-width: 420px;
      width: 100%;
      background: white;
      border-radius: 30px;
      padding: 40px 30px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      animation: fadeIn 0.5s ease;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .logo {
      text-align: center;
      margin-bottom: 30px;
    }
    
    .logo i {
      font-size: 60px;
      color: #667eea;
      margin-bottom: 10px;
    }
    
    .logo h1 {
      font-size: 28px;
      color: #667eea;
    }
    
    .logo p {
      color: #666;
      font-size: 14px;
      margin-top: 5px;
    }
    
    .input-group {
      margin-bottom: 20px;
    }
    
    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 500;
      font-size: 14px;
    }
    
    .input-icon {
      position: relative;
    }
    
    .input-icon i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #999;
    }
    
    input {
      width: 100%;
      padding: 14px 14px 14px 45px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      font-size: 16px;
      transition: 0.2s;
    }
    
    input:focus {
      outline: none;
      border-color: #667eea;
    }
    
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 10px;
    }
    
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }
    
    .signup-link {
      text-align: center;
      margin-top: 25px;
      color: #666;
      font-size: 14px;
    }
    
    .signup-link a {
      color: #667eea;
      text-decoration: none;
      font-weight: bold;
    }
    
    .error-message {
      background: #ffebee;
      color: #c62828;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 20px;
      text-align: center;
    }
    
    .success-message {
      background: #e8f5e9;
      color: #2e7d32;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 20px;
      text-align: center;
    }
    
    .demo-btn {
      background: transparent;
      border: 2px solid #667eea;
      color: #667eea;
      background: white;
      margin-top: 15px;
    }
    
    .demo-btn:hover {
      background: #667eea;
      color: white;
    }
    
    .divider {
      display: flex;
      align-items: center;
      margin: 25px 0;
      color: #999;
      font-size: 12px;
    }
    
    .divider::before, .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #e0e0e0;
    }
    
    .divider span {
      margin: 0 15px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">
      <i class="fas fa-fire"></i>
      <h1>Welcome Back</h1>
      <p>Sign in to continue</p>
    </div>
    
    <div id="messageArea"></div>
    
    <form id="loginForm">
      <div class="input-group">
        <label><i class="fas fa-user"></i> Username</label>
        <div class="input-icon">
          <i class="fas fa-user"></i>
          <input type="text" id="username" placeholder="Enter your username" required>
        </div>
      </div>
      
      <div class="input-group">
        <label><i class="fas fa-lock"></i> Password</label>
        <div class="input-icon">
          <i class="fas fa-lock"></i>
          <input type="password" id="password" placeholder="Enter your password" required>
        </div>
      </div>
      
      <button type="submit" id="loginBtn">
        <i class="fas fa-sign-in-alt"></i> Sign In
      </button>
    </form>
    
    <div class="divider">
      <span>or</span>
    </div>
    
    <button class="demo-btn" id="demoBtn">
      <i class="fas fa-play"></i> Try Demo Account
    </button>
    
    <div class="signup-link">
      Don't have an account? <a href="signup.html">Create Account</a>
    </div>
  </div>

  <script>
    const API_URL = 'http://localhost:3000/api';
    
    function showMessage(message, type) {
      const messageArea = document.getElementById('messageArea');
      const className = type === 'error' ? 'error-message' : 'success-message';
      messageArea.innerHTML = `<div class="${className}">${message}</div>`;
      setTimeout(() => {
        messageArea.innerHTML = '';
      }, 4000);
    }
    
    async function login(e) {
      e.preventDefault();
      
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const loginBtn = document.getElementById('loginBtn');
      
      if (!username || !password) {
        showMessage('Please enter username and password', 'error');
        return;
      }
      
      loginBtn.disabled = true;
      loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';
      
      try {
        const response = await fetch(`${API_URL}/login`, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, password })
        });
        
        const data = await response.json();
        
        if (response.ok) {
          localStorage.setItem('authToken', data.token);
          localStorage.setItem('username', username);
          localStorage.setItem('userId', data.userId);
          
          showMessage('Login successful! Redirecting...', 'success');
          
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 1000);
        } else {
          showMessage(data.error || 'Invalid username or password', 'error');
        }
      } catch (error) {
        console.error('Login error:', error);
        showMessage('Cannot connect to server. Make sure the backend is running on port 3000', 'error');
      } finally {
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
      }
    }
    
    async function demoLogin() {
      const demoBtn = document.getElementById('demoBtn');
      demoBtn.disabled = true;
      demoBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Loading demo...';
      
      try {
        const response = await fetch(`${API_URL}/demo-login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' }
        });
        
        const data = await response.json();
        
        if (response.ok) {
          localStorage.setItem('authToken', data.token);
          localStorage.setItem('username', 'demo_user');
          localStorage.setItem('userId', data.userId);
          
          showMessage('Demo mode activated! Redirecting...', 'success');
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 1000);
        } else {
          throw new Error('Demo login failed');
        }
      } catch (error) {
        // Offline demo fallback
        localStorage.setItem('authToken', 'demo_' + Date.now());
        localStorage.setItem('username', 'demo_user');
        localStorage.setItem('userId', '999');
        showMessage('Demo mode activated (offline)!', 'success');
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1000);
      } finally {
        demoBtn.disabled = false;
        demoBtn.innerHTML = '<i class="fas fa-play"></i> Try Demo Account';
      }
    }
    
    document.getElementById('loginForm').addEventListener('submit', login);
    document.getElementById('demoBtn').addEventListener('click', demoLogin);
    
    // Check if already logged in
    if (localStorage.getItem('authToken')) {
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
